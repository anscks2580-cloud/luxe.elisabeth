<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXE ELISABETH</title>
<meta name="description" content="LUXE ELISABETH — 직접 보고 고른 웨딩드레스. 럭스 소개, 바잉 브랜드, 시즌 컬렉션, 셀럽 착용, 스토어, 상담.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<a class="skip" href="#introduction">본문 바로가기</a>

<!-- ───────── 상단: 로고 한 줄 + 메뉴 한 줄. 화면을 내리면 한 줄로 접힘 ───────── -->
<header class="head" id="head">
  <div class="head-row">
    <a class="logo" href="#top" aria-label="LUXE ELISABETH 처음으로"><span data-logo="line">LUXE ELISABETH</span></a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sheet"><span></span><span></span></button>
  </div>
  <nav class="menu" aria-label="주요 메뉴">
    <a href="#introduction">럭스 소개</a>
    <a href="#buying">바잉 업체</a>
    <a href="#collection">컬렉션</a>
    <a href="#celebrity">셀럽 착용</a>
    <a href="#stores">스토어</a>
    <a href="#consultation">상담</a>
  </nav>
</header>

<!-- 모바일 메뉴 -->
<div class="sheet" id="sheet" aria-hidden="true">
  <nav aria-label="전체 메뉴">
    <a href="#introduction">럭스 소개</a>
    <a href="#buying">바잉 업체</a>
    <a href="#collection">컬렉션</a>
    <a href="#celebrity">셀럽 착용</a>
    <a href="#stores">스토어</a>
    <a href="#consultation">상담</a>
  </nav>
  <a class="sheet-ig" href="https://www.instagram.com/luxe.elisabeth/" target="_blank" rel="noopener">Instagram @luxe.elisabeth</a>
</div>

<main id="top">

  <!-- ═════════ 첫 화면: 사진 한 장이 화면을 채운다. 글·장식 없음 ═════════ -->
  <section class="hero" aria-label="대표 드레스">
    <!-- IMAGE SLOT: HERO MAIN DRESS (data/site-data.js 의 hero) -->
    <div class="hero-stage" id="heroStage" aria-roledescription="carousel" aria-label="대표 드레스 사진"></div>
    <div class="hero-ui" id="heroCtrl" hidden>
      <button type="button" class="hero-arrow prev" id="heroPrev" aria-label="이전 사진"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <button type="button" class="hero-arrow next" id="heroNext" aria-label="다음 사진"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
      <div class="hero-dots" id="heroDots" role="tablist" aria-label="사진 선택"></div>
      <span class="sr" id="heroCount" aria-live="polite"></span>
      <button type="button" class="sr" id="heroPause" aria-label="자동 넘김 멈춤" aria-pressed="false"></button>
      <span hidden id="heroBar"></span>
    </div>
  </section>

  <!-- 나머지 구역(01 럭스 소개 ~ 06 상담)은 첫 화면 확인 후 같은 규칙으로 이어서 구성 -->

</main>

<footer class="foot">
  <span class="foot-logo" data-logo="line">LUXE ELISABETH</span>
  <a class="foot-ig" href="https://www.instagram.com/luxe.elisabeth/" target="_blank" rel="noopener">Instagram @luxe.elisabeth</a>
  <p class="foot-meta">© LUXE ELISABETH</p>
</footer>

<script src="js/logo.js?v=6"></script>
<script src="data/site-data.js?v=6"></script>
<script src="js/shared.js?v=6"></script>
<script src="js/site.js?v=6"></script>
</body>
</html>
